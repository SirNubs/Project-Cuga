name: Clang-Tidy

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned LLVM analyzer
        run: |
          python3 -m venv out/tidy-tools
          out/tidy-tools/bin/pip install --require-hashes -r scripts/ci/clang-tidy-requirements.txt
      - name: Configure public compilation database
        run: >-
          cmake -S . -B out/tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DPSPRECOMP_PROFILE=mhp3rd -DPSPRECOMP_BUILD_TESTS=ON
          -DMHP3RD_RENDERER=OFF -DMHP3RD_FFMPEG=OFF
      - name: Analyze first-party translation units
        run: python3 scripts/ci/clang_tidy.py
      - name: Upload analysis diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-tidy-diagnostics
          path: out/tidy/clang-tidy-results/
          if-no-files-found: ignore
          retention-days: 7
